openapi: 3.0.3
info:
  title: Transfer Funds
  version: 1.0.0

paths:
  /api/v1/transfer:
    post:
      summary: Transfer funds from the authenticated user to another user
      operationId: createTransfer
      tags:
        - transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Invalid transfer request (amount/self-transfer/insufficient funds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No valid active session for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Destination user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    TransferRequest:
      type: object
      required:
        - destinationUser
        - amount
      properties:
        destinationUser:
          type: string
          description: Existing user identifier that receives the funds
          example: bob
        amount:
          type: number
          format: double
          description: Positive amount to transfer
          example: 50.0

    TransferResponse:
      type: object
      required:
        - sourceBalance
        - destinationBalance
      properties:
        sourceBalance:
          type: number
          format: double
          description: Updated source user balance after transfer
          example: 150.0
        destinationBalance:
          type: number
          format: double
          description: Updated destination user balance after transfer
          example: 320.0
        message:
          type: string
          description: Human-readable confirmation message
          example: Transfer successful

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Authentication error
