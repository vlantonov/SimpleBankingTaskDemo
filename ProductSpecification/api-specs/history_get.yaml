openapi: 3.0.3
info:
  title: Transaction History
  version: 1.0.0

paths:
  /api/v1/history:
    get:
      summary: Retrieve the authenticated user's transaction history
      operationId: getHistory
      tags:
        - history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          description: No valid active session for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HistoryResponse:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          description: The authenticated user's ledger entries, ordered newest-first
          items:
            $ref: '#/components/schemas/TransactionEntry'

    TransactionEntry:
      type: object
      required:
        - type
        - amount
        - timestamp
      properties:
        type:
          type: string
          description: Ledger event type, such as deposit or withdrawal
          example: deposit
        amount:
          type: number
          format: double
          description: Signed amount for the transaction
          example: 75.5
        timestamp:
          type: string
          format: date-time
          description: Time when the transaction was recorded
          example: '2026-10-16T10:15:00Z'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Authentication error
